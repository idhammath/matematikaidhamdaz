        <script>soal(dertel,3,1);
        document.getElementById("soal1").innerHTML = String.raw`Tentukan nilai dari <m>\dfrac3{1!+2!+3!}+\dfrac4{2!+3!+4!}+\dfrac5{3!+4!+5!}+\cdots+\dfrac{${no1}}{${no1-2}!+${no1-1}!+${no1}!}</m>`;
        document.getElementById("jaw1").innerHTML = String.raw`<m>\begin{aligned}
                        \dfrac{k+2}{k!+(k+1)!+(k+2)!}&amp;=\dfrac{k+2}{k!(1+(k+1)+(k+2)(k+1))}\\[8pt]
                        &amp;=\dfrac{k+2}{k!\left(1+k+1+k^2+3k+2\right)}\\[8pt]
                        &amp;=\dfrac{k+2}{k!\left(k^2+4k+4\right)}\\[8pt]
                        &amp;=\dfrac{k+2}{k!\left(k+2\right)^2}\\[8pt]
                        &amp;=\dfrac1{k!\left(k+2\right)}\\[8pt]
                        &amp;=\dfrac{k+1}{(k+2)!}\\[8pt]
                        &amp;=\dfrac{k+2-1}{(k+2)!}\\[8pt]
                        &amp;=\dfrac1{(k+1)!}-\dfrac1{(k+2)!}
                        \end{aligned}</m><br />
                        <br />
                        <m>\begin{aligned}
                        \dfrac3{1!+2!+3!}+\dfrac4{2!+3!+4!}+\dfrac5{3!+4!+5!}+\cdots+\dfrac{${no1}}{${no1-2}!+${no1-1}!+${no1}!}&amp;=\dfrac1{2!}-\dfrac1{3!}+\dfrac1{3!}-\dfrac1{4!}+\dfrac1{4!}-\dfrac1{5!}+\cdots+\dfrac1{${no1-1}!}-\dfrac1{${no1}!}\\[8pt]
                        &amp;=\dfrac1{2!}-\dfrac1{${no1}!}
                        \end{aligned}</m>`;
        document.getElementById("jad1").innerHTML = String.raw`Jadi, <m>\dfrac3{1!+2!+3!}+\dfrac4{2!+3!+4!}+\dfrac5{3!+4!+5!}+\cdots+\dfrac{${no1}}{${no1-2}!+${no1-1}!+${no1}!}=\dfrac1{2!}-\dfrac1{${no1}!}</m>.`
        document.getElementById("soal2").innerHTML = String.raw`Hitunglah nilai <m>\displaystyle\sum_{k=1}^{${no1}}\dfrac{k+2}{k(k+1)2^k}</m>`;
        document.getElementById("jaw2").innerHTML = String.raw`<m>\begin{aligned}
                        \displaystyle\sum_{k=1}^{${no1}}\dfrac{k+2}{k(k+1)2^k}&=\displaystyle\sum_{k=1}^{${no1}}\left(\dfrac2k-\dfrac1{k+1}\right)\dfrac1{2^k}\\[8pt]
                        &=\displaystyle\sum_{k=1}^{${no1}}\left(\dfrac1{k\cdot2^{k-1}}-\dfrac1{(k+1)\cdot2^k}\right)\\[8pt]
                        &=\dfrac1{1\cdot2^0}-\dfrac1{2\cdot2^1}+\dfrac1{2\cdot2^1}-\dfrac1{3\cdot2^2}+\cdots+\dfrac1{${no1}\cdot2^{${no1-1}}}-\dfrac1{${no1+1}\cdot2^{${no1}}}\\[8pt]
                        &=\boxed{\boxed{1-\dfrac1{<span class="no2"></span>\cdot2^{${no1}}}}}
                     \end{aligned}</m>`;
        document.getElementById("jad2").innerHTML = String.raw`Jadi, <m>\displaystyle\sum_{k=1}^{${no1}}\dfrac{k+2}{k(k+1)2^k}=1-\dfrac1{${no1+1}\cdot2^{${no1}}}</m>.`
